  <style>
    :root {
      --bg: #f2efe6;
      --paper: #faf8f2;
      --text: #0e1524;
      --muted: #596475;
      --accent: #c89b3c;
      --teal: #4f8f86;
      --border: #d4cfc2;
      --card-bg: #ffffff;
      --shadow: 0 10px 30px rgba(14, 21, 36, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    @media(min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      background: var(--paper);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab[aria-pressed="true"] {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--paper);
      font-size: 0.95rem;
    }

    @media(min-width: 768px) {
      .search-box input {
        width: 250px;
      }
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: var(--shadow);
    }

    .card__photo img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .card__icon {
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .card__icon svg {
      width: 60px;
      height: 60px;
    }

    .card__title {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .card__desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .card__meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 15px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .card__meta div {
      display: flex;
      justify-content: space-between;
    }

    .card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .card__price {
      font-weight: bold;
      color: var(--accent);
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
    }

    .card__price small {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: normal;
    }

    .btn {
      background: var(--text);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--teal);
    }

    .ad-slot {
      grid-column: 1 / -1;
      background: var(--paper);
      border: 1px dashed var(--border);
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      color: var(--muted);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      display: none;
      color: var(--muted);
    }

    .empty-state.show {
      display: block;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
  </style>
</head>

    function buildTabs(){
      const frag = document.createDocumentFragment();
      const allTab = makeTab('all', 'All Categories');
      frag.appendChild(allTab);
      CATEGORY_ORDER.forEach(cat => {
        frag.appendChild(makeTab(cat, CATEGORY_LABELS[cat] || cat));
      });
      tabList.appendChild(frag);
    }

    function makeTab(cat, label){
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.textContent = label;
      btn.dataset.cat = cat;
      btn.setAttribute('aria-pressed', cat === 'all' ? 'true' : 'false');
      btn.addEventListener('click', () => {
        activeCategory = cat;
        [...tabList.children].forEach(t => t.setAttribute('aria-pressed', t === btn ? 'true' : 'false'));
        resetAndRender();
      });
      return btn;
    }

    /* ---------------- Card rendering ---------------- */
    function cardHTML(p){
      return `<article class="card" data-cat="${p.category}">
        ${p.image
          ? `<div class="card__photo" data-cat="${p.category}"><img src="${p.image}" alt="${escapeHTML(p.title)}" loading="lazy" onerror="handleImgError(this)"></div>`
          : `<div class="card__icon" aria-hidden="true">${ICONS[p.category] || ''}</div>`
        }
        <h3 class="card__title">${escapeHTML(p.title)}</h3>
        <p class="card__desc">${escapeHTML(p.desc)}</p>
        <dl class="card__meta">
          <div><dt>SKU</dt><dd>${p.sku}</dd></div>
          <div><dt>Category</dt><dd>${escapeHTML(p.categoryLabel)}</dd></div>
          <div><dt>Origin</dt><dd>${escapeHTML(p.originName)}</dd></div>
        </dl>
        <div class="card__footer">
          <span class="card__price"><small>Price</small>${p.price}</span>
          <a class="btn" href="${p.link}" target="_blank" rel="noopener noreferrer sponsored" aria-label="View ${escapeHTML(p.title)} on official store">
            View on Store →
          </a>
        </div>
      </article>`;
    }

    function adSlotHTML(index){
      return `<div class="ad-slot" role="complementary" aria-label="Advertisement">
        <span>Advertisement · in-feed unit · slot ${index}</span>
      </div>`;
    }

    window.handleImgError = function(imgEl){
      const wrap = imgEl.closest('.card__photo');
      if (!wrap) return;
      const cat = wrap.dataset.cat;
      const iconDiv = document.createElement('div');
      iconDiv.className = 'card__icon';
      iconDiv.setAttribute('aria-hidden', 'true');
      iconDiv.innerHTML = ICONS[cat] || '';
      wrap.replaceWith(iconDiv);
    };

    function escapeHTML(str){
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* ---------------- Filtering + render ---------------- */
    function getFiltered(){
      const q = activeQuery.trim().toLowerCase();
      return PRODUCTS.filter(p => {
        const matchesCat = activeCategory === 'all' || p.category === activeCategory;
        const haystack = (p.title + ' ' + p.desc + ' ' + p.categoryLabel + ' ' + p.originName).toLowerCase();
        const matchesQuery = q === '' || haystack.includes(q);
        return matchesCat && matchesQuery;
      });
    }

    function render(){
      const allFiltered = getFiltered();
      const paginatedItems = allFiltered.slice(0, displayedCount);
      
      const parts = [];
      paginatedItems.forEach((p, i) => {
        parts.push(cardHTML(p));
        if ((i + 1) % 6 === 0 && i !== paginatedItems.length - 1){
          parts.push(adSlotHTML(Math.ceil((i + 1) / 6)));
        }
      });

      grid.innerHTML = parts.join('');
      emptyState.classList.toggle('show', allFiltered.length === 0);
      resultCount.textContent = `Showing ${paginatedItems.length} of ${allFiltered.length} products.`;
    }

    function resetAndRender(){
      displayedCount = 8;
      render();
    }

    /* ---------------- Infinite Scroll ---------------- */
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
        const allFiltered = getFiltered();
        if (displayedCount < allFiltered.length) {
          displayedCount += 6;
          render();
        }
      }
    });

    /* ---------------- Search ---------------- */
    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        activeQuery = e.target.value;
        resetAndRender();
      }, 120);
    });

    /* ---------------- Misc ---------------- */
    const currentYear = new Date().getFullYear();
    document.getElementById('year').textContent = currentYear;
    document.getElementById('yearFoot').textContent = currentYear;
    document.getElementById('statCount').textContent = PRODUCTS.length;
    document.getElementById('liveDate').textContent = new Date().toLocaleDateString('en-US', { year:'numeric', month:'short', day:'2-digit' });

    buildTabs();
    render();
  })();
  </script>
</body>
</html>
